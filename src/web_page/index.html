<!doctype html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>roxy</title>
		<link rel="icon" href="data:,">

		<style>
			:root {
				color-scheme: dark;
				--bg:    #08090c;
				--fg:    #c9d1d9;
				--dim:   #4a515b;
				--faint: #24282e;
				--ok:    #5f7e94;
			}
			
			::selection {
				background-color: var(--dim);
				color: var(--faint);
			}


			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--fg);
				font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			}

			main {
				width: min(88vw, 36em);
				display: grid;
				gap: 22px;
			}

			pre {
				margin: 0;
				font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				white-space: pre-wrap;
				word-break: break-all;
			}

			.req  { color: var(--dim); }
			.key  { color: var(--faint); }
			.ok   { color: var(--ok); }

			.foot {
				display: flex;
				justify-content: flex-end;
				align-items: baseline;
				gap: 20px;
			}

			.mark {
				display: flex;
				gap: .40em;
				justify-content: center;
				font-size: 13px;
				text-transform: lowercase;
				transition: gap .5s ease, color .5s ease, text-shadow .5s ease;
			}

			.mark span {
				display: inline-block;
				transition: transform 0.5s ease;
			}

			.mark:hover {
				gap: .50em;
				color: var(--fg);
				text-shadow: 0 0 30px var(--ok);
			}
			p {
				margin: 0;
				color: var(--faint);
				font-size: 13px;
			}

			a {
				color: var(--dim);
				text-decoration: none;
			}

		</style>
	</head>

	<body>
		<main>
			<pre class="req">GET <span id="path">/</span> HTTP/1.1
<span class="key">host:</span> 127.0.0.1:8080
<span class="key">user-agent:</span> <span id="ua">-</span></pre>

			<pre class="res"><span class="ok">HTTP/1.1 200 OK</span>

			<div class="foot">
			<a href="https://github.com/vid4l-07/Roxy" class="mark"><span>r</span><span>o</span><span>x</span><span>y</span></a>
			</div>
		</main>

		<script>
			path.textContent = location.pathname;
			ua.textContent = navigator.userAgent;
		</script>
	</body>

</html>
